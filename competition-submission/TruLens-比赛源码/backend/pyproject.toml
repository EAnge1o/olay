[project]
name = "trulens-backend"
version = "0.1.0"
description = "TruLens · 美妆内容可信度核验 Agent 平台 — FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
