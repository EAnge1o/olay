name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'fronted/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Media assets are stored in Git LFS; the Pages build needs the real files.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - name: Install dependencies
        working-directory: fronted
        run: npm ci

      - name: Build
        working-directory: fronted
        env:
          # GitHub Pages serves the site at /olay/, so assets need that base.
          VITE_BASE: /olay/
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fronted/dist

      - id: deployment
        uses: actions/deploy-pages@v4
