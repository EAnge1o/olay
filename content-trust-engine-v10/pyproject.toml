[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-trust-engine"
version = "0.1.0"
description = "Explainable trust analysis module for marketing and social media content."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "openai>=1,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nfa_vit = ["gradio-client>=1.7,<2"]
nfa_vit_local = [
    "torch>=2.5,<3",
    "numpy<2",
    "pillow>=10,<12",
    "einops==0.8.1",
    "huggingface_hub>=0.30,<2",
    "gradio>=5,<6",
    "gradio-client>=1.7,<2",
]
lota_local = [
    "torch>=2.5,<3",
    "numpy<2",
    "pillow>=10,<12",
    "opencv-python-headless>=4.8,<5",
]
ferretnet_local = [
    "torch>=2.5,<3",
    "numpy<2",
    "pillow>=10,<12",
]
provenance = ["c2pa-python>=0.37,<1", "Pillow>=10,<13"]
trufor_local = [
    "torch>=2.5,<3",
    "numpy<2",
    "pillow>=10,<13",
    "yacs>=0.1.8,<1",
    "timm>=0.5.4,<1",
    "matplotlib>=3.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["content_trust*"]

[tool.setuptools.package-data]
content_trust = [
    "prompts/*.txt",
    "evaluation/*.jsonl",
    "evaluation/*.json",
    "evaluation/*.md",
]
